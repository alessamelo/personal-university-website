<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web - Contact</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" type="image/jpg" href="../images/tamon.jpg">
</head>

<body>

    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="schedule.html">Schedule</a>
            <a href="hobbies.html">Hobbies</a>

        <h1>
            Contact Me
        </h1>

        <p>
            If you have any questions, suggestions, or comments, 
            please fill out the form below.
        </p>

        

    </header>

    <main>

        <section>

            <h2>Contact Form</h2>
<form>

    <label>
        Name:
        <input type="text" name="username">
    </label>

    <br>

    <label>
        Date of Birth:
        <input type="date" name="birthdate">
    </label>

    <br>

    <label>
        Email:
        <input type="email" name="email">
    </label>

    <p>Degree Program:</p>

    <label>
        <input type="radio" name="degree" value="physics">
        Physics
    </label>

    <label>
        <input type="radio" name="degree" value="nanotechnology">
        Nanotechnology
    </label>

    <label>
        <input type="radio" name="degree" value="mathematics">
        Mathematics
    </label>

    <label>
        <input type="radio" name="degree" value="chemistry">
        Chemistry
    </label>

    <label>
        <input type="radio" name="degree" value="agro">
        Agro
    </label>

    <label>
        <input type="radio" name="degree" value="computer-science">
        Computer Science
    </label>

    <label>
        <input type="radio" name="degree" value="biology">
        Biology
    </label>

    <label>
        <input type="radio" name="degree" value="data-science">
        Data Science
    </label>

    <label>
        <input type="radio" name="degree" value="biomedicine">
        Biomedicine
    </label>

    <p>Semester:</p>

    <label>
        <input type="radio" name="semester" value="1">
        1st Semester
    </label>

    <label>
        <input type="radio" name="semester" value="2">
        2nd Semester
    </label>

    <label>
        <input type="radio" name="semester" value="3">
        3rd Semester
    </label>

    <label>
        <input type="radio" name="semester" value="4">
        4th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="5">
        5th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="6">
        6th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="7">
        7th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="8">
        8th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="9">
        9th Semester
    </label>

    <label>
        <input type="radio" name="semester" value="10">
        10th Semester
    </label>

    <br>

    <label>
        Reason for Contact:
        <input type="text" name="reason">
    </label>

    <br>

    <label>
        Message:
        <textarea name="message"></textarea>
    </label>

    <br>

    <label>
        <input type="checkbox" name="accept">
        I agree to send this message.
    </label>

    <br>

    <input type="submit" value="Submit">

</form>
        </section>
    </main>
</body>
</html>
